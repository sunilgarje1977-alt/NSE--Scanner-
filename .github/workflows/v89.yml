name: V89 REAL PRICE FUTURE
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 3-10 * * 1-5'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests cloudscraper pytz pandas
      - name: V89
        run: |
          python << 'PY'
          import os, requests, time, pytz, math
          import pandas as pd
          from datetime import datetime, timedelta
          IST = pytz.timezone('Asia/Kolkata')
          now = datetime.now(IST)
          TIME = now.strftime('%H:%M:%S')
          DATE = now.strftime('%d %b %Y')
          BOT = os.getenv('BOT_TOKEN')
          CHAT = os.getenv('CHAT_ID')
          def tg(m):
              try:
                  for i in range(0, len(m), 3800):
                      requests.post(f'https://api.telegram.org/bot{BOT}/sendMessage', data={'chat_id': CHAT, 'text': m[i:i+3800]}, timeout=15)
                      time.sleep(1)
              except: pass
          import cloudscraper
          scraper = cloudscraper.create_scraper()
          try:
              scraper.get('https://www.nseindia.com', timeout=15)
              time.sleep(3)
          except: pass

          def get_nse_real_and_future(symbol_nse, atm, is_nifty):
              ce_real=None; pe_real=None; expiry="27 Oct (Tuesday)"; future=None
              try:
                  url = 'https://www.nseindia.com/api/option-chain-indices?symbol=NIFTY' if is_nifty else f'https://www.nseindia.com/api/option-chain-equities?symbol={symbol_nse}'
                  r = scraper.get(url, headers={'Referer':'https://www.nseindia.com/option-chain'}, timeout=20)
                  data = r.json()
                  expiry = data['records']['expiryDates'][0]
                  future = float(data['records']['underlyingValue']) if 'underlyingValue' in data['records'] else None
                  for rec in data['records']['data']:
                      if rec.get('expiryDate') != expiry: continue
                      if rec.get('strikePrice') != atm: continue
                      if 'CE' in rec and rec['CE'].get('lastPrice',0)>0: ce_real=float(rec['CE']['lastPrice'])
                      if 'PE' in rec and rec['PE'].get('lastPrice',0)>0: pe_real=float(rec['PE']['lastPrice'])
                      break
                  print(f"REAL NSE {symbol_nse} ATM {atm} FUT {future} EXP {expiry} CE {ce_real} PE {pe_real}")
              except Exception as e:
                  print(f"NSE Fail {symbol_nse} {e}")
              return ce_real, pe_real, expiry, future

          def get_5min_df(yahoo):
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{yahoo}?range=2d&interval=5m"
              r = requests.get(url, headers={'User-Agent':'Mozilla/5.0'}, timeout=12).json()
              res = r['chart']['result'][0]
              df = pd.DataFrame({
                  'close': res['indicators']['quote'][0]['close'],
                  'high': res['indicators']['quote'][0]['high'],
                  'low': res['indicators']['quote'][0]['low'],
                  'volume': res['indicators']['quote'][0]['volume']
              }).dropna().tail(80)
              df['volume']=df['volume'].replace(0,100000).fillna(100000)
              df['9EMA']=df['close'].ewm(span=9, adjust=False).mean()
              df['VWAP']=((df['high']+df['low']+df['close'])/3*df['volume']).cumsum()/df['volume'].cumsum()
              delta=df['close'].diff()
              df['RSI']=100-(100/(1+(delta.where(delta>0,0)).rolling(14).mean()/(-delta.where(delta<0,0)).rolling(14).mean())))
              df['VolAvg']=df['volume'].rolling(20).mean()
              return df

          def realistic_price(spot, atm, is_nifty):
              # CORRECTED FORMULA - TCS 27 Rs सारखा
              diff=abs(spot-atm)
              if is_nifty:
                  # NIFTY Weekly ATM 80-180
                  base = 85 + diff*0.3
                  return round(max(40, min(180, base)),0)
              else:
                  # STOCK Weekly ATM - 1-2% of spot
                  # TCS 2507 ATM 2500 diff 7 => 27 Rs Real
                  if spot < 500: base = spot*0.015 + diff*0.2  # ITC 259 => ~5-8 Rs
                  elif spot < 1500: base = spot*0.012 + diff*0.25  # RELIANCE 1184 => ~18-25
                  elif spot < 3000: base = spot*0.011 + diff*0.3  # TCS 2507 => 27+7*0.3=~30 Rs ✅
                  else: base = spot*0.010 + diff*0.35  # LT 3638 => ~42 Rs
                  return round(max(3, min(120, base)),0)

          final_msg = f"🔥 V89 REAL + FUTURE @ {DATE} {TIME}\nNIFTY FUTURE Price + Real NSE Price Fix | Tuesday 27 Oct Expiry\n\n"
          tests = [
              ("%5ENSEI","NIFTY","NIFTY",True),
              ("RELIANCE.NS","RELIANCE","RELIANCE",False),
              ("TCS.NS","TCS","TCS",False),
              ("INFY.NS","INFY","INFY",False),
              ("LT.NS","LT","LT",False),
          ]
          for yahoo, name, nse, is_nifty in tests:
              try:
                  df = get_5min_df(yahoo)
                  c=df.iloc[-1]; p=df.iloc[-2]
                  spot=float(c['close'])
                  ema=float(c['9EMA']); vwap=float(c['VWAP']); rsi=float(c['RSI']); vol=float(c['volume']); volAvg=float(c['VolAvg'])
                  # Get Future + Real Price from NSE
                  ce_real, pe_real, expiry, future = get_nse_real_and_future(nse, round(spot/50)*50 if is_nifty or spot>1000 else round(spot/10)*10, is_nifty)
                  fut = future if future else (spot*1.004 if is_nifty else spot*1.003)
                  atm = round(fut/50)*50 if is_nifty or fut>1000 else round(fut/10)*10
                  # Re-fetch Real Price with correct ATM (Future ATM)
                  if atm != round(spot/50)*50:
                      ce_real2, pe_real2, _, _ = get_nse_real_and_future(nse, atm, is_nifty)
                      if ce_real2: ce_real=ce_real2
                      if pe_real2: pe_real=pe_real2
                  
                  # Use Real if available else Realistic Estimate (27 Rs Fix)
                  ce_est = realistic_price(fut, atm, is_nifty)
                  pe_est = realistic_price(fut, atm, is_nifty)
                  # Adjust for OTM
                  if fut > atm:
                      ce_est = round(ce_est*0.65,0)
                      pe_est = round(pe_est*1.35,0)
                  else:
                      ce_est = round(ce_est*1.35,0)
                      pe_est = round(pe_est*0.65,0)
                  ce = ce_real if ce_real and ce_real>0 else ce_est
                  pe = pe_real if pe_real and pe_real>0 else pe_est
                  
                  fresh_up = float(p['9EMA'])<=float(df.iloc[-2]['VWAP']) and ema>vwap
                  fresh_down = float(p['9EMA'])>=float(df.iloc[-2]['VWAP']) and ema<vwap
                  active_up = ema>vwap
                  active_down = ema<vwap
                  vol_ok = vol>volAvg*0.6
                  
                  def sl_t(price, is_nifty):
                      if is_nifty: return price-20, price+40, price+80, price+120
                      else:
                          if price<25: return round(price*0.6,0), round(price*1.7,0), round(price*2.4,0), round(price*3.2,0)
                          else: return round(max(price*0.65, price-20),0), price+30, price+60, price+90
                  
                  label_real = "REAL NSE" if (ce_real or pe_real) else "EST FIX"
                  if (fresh_up or active_up) and 40<=rsi<=75 and vol_ok and active_up:
                      sl,t1,t2,t3=sl_t(ce, is_nifty)
                      final_msg+=f"🟢 {name} CE BUY 5MIN @ {TIME}\nSPOT {spot:.0f} FUT {fut:.0f} ATM {atm} EXP {expiry} [{label_real}]\n9EMA {ema:.0f} {'FRESH CROSS UP ✅✅' if fresh_up else 'ACTIVE UP ✅'} VWAP {vwap:.0f} RSI {rsi:.0f} VOL {vol/volAvg:.1f}x\n📈 BUY {atm} CE @ {ce:.0f} SL {sl:.0f} T1 {t1:.0f} T2 {t2:.0f} T3 {t3:.0f}\nTRAIL T1->Cost\n\n"
                  elif (fresh_down or active_down) and 25<=rsi<=65 and vol_ok and active_down:
                      sl,t1,t2,t3=sl_t(pe, is_nifty)
                      final_msg+=f"🔴 {name} PE BUY 5MIN @ {TIME}\nSPOT {spot:.0f} FUT {fut:.0f} ATM {atm} EXP {expiry} [{label_real}]\n9EMA {ema:.0f} {'FRESH CROSS DOWN ✅✅' if fresh_down else 'ACTIVE DOWN ✅'} VWAP {vwap:.0f} RSI {rsi:.0f} VOL {vol/volAvg:.1f}x\n📉 BUY {atm} PE @ {pe:.0f} SL {sl:.0f} T1 {t1:.0f} T2 {t2:.0f} T3 {t3:.0f}\nTRAIL T1->Cost\n\n"
                  else:
                      final_msg+=f"⏳ {name} {spot:.0f} FUT {fut:.0f} WAIT 5MIN @ {TIME}\n9EMA {ema:.0f} vs VWAP {vwap:.0f} RSI {rsi:.0f} | ATM {atm} CE {ce:.0f} PE {pe:.0f} [{label_real}] EXP {expiry}\n\n"
                  time.sleep(2)
              except Exception as e:
                  final_msg+=f"⏳ {name} Error {str(e)[:50]}\n\n"
          print(final_msg)
          tg(final_msg)
          PY
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
