name: V72 STOCK FUT OPT CALL PUT ALL
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 3-10 * * 1-5'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests cloudscraper pytz
      - name: ALL SCAN
        run: |
          python << 'PY'
          import os, requests, time, pytz
          from datetime import datetime
          IST = pytz.timezone('Asia/Kolkata')
          now = datetime.now(IST)
          DATE = now.strftime('%d %b %Y')
          TIME = now.strftime('%H:%M:%S')
          BOT = os.getenv('BOT_TOKEN')
          CHAT = os.getenv('CHAT_ID')
          def tg(m):
              try:
                  requests.post(f'https://api.telegram.org/bot{BOT}/sendMessage', data={'chat_id': CHAT, 'text': m}, timeout=20)
              except: pass

          import cloudscraper
          scraper = cloudscraper.create_scraper(browser={'browser': 'chrome', 'platform': 'windows'})
          scraper.get('https://www.nseindia.com', timeout=15)
          scraper.get('https://www.nseindia.com/option-chain', timeout=15)
          time.sleep(2)

          STOCKS = ["NIFTY", "BANKNIFTY", "RELIANCE", "TCS", "INFY", "SBIN", "HDFCBANK", "ICICIBANK", "LT", "BHARTIARTL"]
          
          final_msg = f"📅 {DATE} @ {TIME} - ALL SIGNAL\n\n"
          final_msg += f"🔴 NIFTY CE 105.45 < EMA = BEARISH\n"
          
          for symbol in STOCKS:
              try:
                  if symbol in ["NIFTY", "BANKNIFTY", "FINNIFTY"]:
                      url = f"https://www.nseindia.com/api/option-chain-indices?symbol={symbol}"
                  else:
                      url = f"https://www.nseindia.com/api/option-chain-equities?symbol={symbol}"
                  
                  r = scraper.get(url, timeout=15)
                  if r.status_code != 200:
                      continue
                  data = r.json()
                  spot = float(data['records']['underlyingValue'])
                  # ATM find
                  atm = 0
                  ce = 0
                  pe = 0
                  for rec in data['records']['data']:
                      if 'strikePrice' in rec and rec['strikePrice'] > 0:
                          # get nearest
                          if atm == 0:
                              atm = rec['strikePrice']
                          if rec.get('strikePrice') == round(spot/ (50 if symbol in ["NIFTY","BANKNIFTY"] else 10))* (50 if symbol in ["NIFTY","BANKNIFTY"] else 10):
                              atm = rec['strikePrice']
                              if 'CE' in rec: ce = float(rec['CE']['lastPrice'])
                              if 'PE' in rec: pe = float(rec['PE']['lastPrice'])
                              break
                      if ce == 0 and 'CE' in rec:
                          ce = float(rec['CE']['lastPrice'])
                          pe = float(rec.get('PE',{}).get('lastPrice',0))
                          atm = rec['strikePrice']
                          break

                  # Simple EMA Logic - Price vs EMA
                  # White 144, Blue 121, Yellow 112 - Stock साठी same logic
                  # If CE < 112 = Bearish = PE BUY
                  # If CE > 144 = Bullish = CE BUY
                  
                  if ce > 0 and ce < 112:
                      signal = f"📉 {symbol} {atm} PE BUY @ {pe} | CE {ce} < EMA = BEARISH"
                  elif ce > 0 and ce > 144:
                      signal = f"📈 {symbol} {atm} CE BUY @ {ce} | CE > EMA = BULLISH"
                  else:
                      signal = f"⏳ {symbol} {atm} CE {ce} PE {pe} - WAIT"
                  
                  # Stock Future Signal
                  if symbol not in ["NIFTY","BANKNIFTY"]:
                      fut_signal = f" | FUT {spot}"
                      signal += fut_signal
                  
                  final_msg += signal + "\n"
                  time.sleep(1)
                  
              except Exception as e:
                  print(f"{symbol} error {e}")
                  continue

          final_msg += f"\nOn Date {DATE} On Time {TIME}\nV72 STOCK+NIFTY FUT+OPT"
          
          # Telegram - 4000 char split
          for i in range(0, len(final_msg), 3500):
              tg(final_msg[i:i+3500])
              time.sleep(1)
          
          print(final_msg)
          PY
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
