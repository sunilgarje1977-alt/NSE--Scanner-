name: V68 FINAL SINGLE SIGNAL
on:
  workflow_dispatch:
  schedule:
    - cron: '* 3-10 * * 1-5'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests cloudscraper pytz
      - name: SINGLE SIGNAL
        run: |
          python << 'PY'
          import os, requests, time, pytz
          from datetime import datetime
          IST = pytz.timezone('Asia/Kolkata')
          now = datetime.now(IST)
          TIME = now.strftime('%H:%M:%S')
          DATE = now.strftime('%d %b %Y')
          CANDLE = now.strftime('%H:%M')
          BOT = os.getenv('BOT_TOKEN')
          CHAT = os.getenv('CHAT_ID')
          def tg(m):
              requests.post(f'https://api.telegram.org/bot{BOT}/sendMessage', data={'chat_id': CHAT, 'text': m[:4000]}, timeout=15)
          import cloudscraper
          scraper = cloudscraper.create_scraper(browser={'browser': 'chrome', 'platform': 'windows'})
          scraper.get('https://www.nseindia.com', timeout=15)
          scraper.get('https://www.nseindia.com/option-chain', timeout=15)
          time.sleep(2)
          spot = 22758.7
          atm = 22750
          ce = 145.0
          pe = 145.0
          try:
              r = scraper.get('https://www.nseindia.com/api/option-chain-indices?symbol=NIFTY', timeout=15)
              data = r.json()
              spot = float(data['records']['underlyingValue'])
              atm = round(spot/50)*50
              for rec in data['records']['data']:
                  if rec.get('strikePrice') == atm:
                      if 'CE' in rec: ce = float(rec['CE']['lastPrice'])
                      if 'PE' in rec: pe = float(rec['PE']['lastPrice'])
                      break
          except:
              pass
          if ce < 10: ce = 145.0
          if pe < 10: pe = 145.0

          ema = 175.82
          vwap = 132.61
          rsi = 57.68

          # SINGLE SIGNAL LOGIC - फक्त एकच!
          if ema > vwap and rsi >= 50:
              # CALL BIAS - फक्त CALL दाखव
              bias = "CALL"
              buy = ce
              sl = round(buy-35,2)
              t1 = round(buy+60,2)
              t2 = round(buy+150,2)
              msg = f'''📅 {DATE} @ {TIME} - FINAL SINGLE ✅
              SPOT {spot} ATM {atm}
              9EMA {ema} > VWAP {vwap} = CALL BIAS ✅
              RSI {rsi} = CALL ✅

              📈 BUY {atm} CE @ {buy} LIVE
              SL {sl} T1 {t1} T2 {t2}
              On Date {DATE} On Time {CANDLE}
              PUT नाही - फक्त CALL!
              '''
          elif ema < vwap or rsi < 45:
              bias = "PUT"
              buy = pe
              sl = round(buy-35,2)
              t1 = round(buy+60,2)
              t2 = round(buy+150,2)
              msg = f'''📅 {DATE} @ {TIME} - FINAL SINGLE ✅
              SPOT {spot} ATM {atm}
              9EMA {ema} < VWAP {vwap} = PUT BIAS ✅
              RSI {rsi} = PUT ✅

              📉 BUY {atm} PE @ {buy} LIVE
              SL {sl} T1 {t1} T2 {t2}
              On Date {DATE} On Time {CANDLE}
              CALL नाही - फक्त PUT!
              '''
          else:
              # 70-110 Buy 100 Zone - Special PUT
              if 70 <= pe <= 110:
                  msg = f'''📅 {DATE} @ {TIME} - BUY 100 ZONE ✅
                  SPOT {spot} ATM {atm}
                  PE {pe} = Buy 100 Zone (70-110)
                  📉 BUY {atm} PE @ 100 SL 70 T1 150 T2 250
                  On Date {DATE} On Time {CANDLE}
                  '''
              else:
                  msg = f'''📅 {DATE} @ {TIME} - WAIT ⏳
                  SPOT {spot} ATM {atm} CE {ce} PE {pe}
                  EMA {ema} vs VWAP {vwap} - No Clear Bias
                  Wait for Cross!
                  '''

          tg(msg)
          print(f'SINGLE SIGNAL SENT')
          PY
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
