name: V100 SINGLE BEST SIGNAL
on:
  workflow_dispatch:
  schedule:
    - cron: '* 3-10 * * 1-5'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz pandas numpy
      - name: V100
        run: |
          python << 'PY'
          import os, requests, time, pytz, pandas as pd
          from datetime import datetime, timedelta
          IST = pytz.timezone('Asia/Kolkata')
          now = datetime.now(IST)
          TIME = now.strftime('%H:%M:%S')
          DATE = now.strftime('%d %b %Y')
          BOT = os.getenv('BOT_TOKEN')
          CHAT = os.getenv('CHAT_ID')
          def tg(m):
              try:
                  requests.post(f'https://api.telegram.org/bot{BOT}/sendMessage', data={'chat_id': CHAT, 'text': m}, timeout=15)
              except: pass
          def get_expiry(): 
              today = now.date()
              days_ahead = 1 - today.weekday()
              if days_ahead < 0: days_ahead += 7
              if days_ahead == 0 and now.hour >= 16: days_ahead = 7
              return (today + timedelta(days=days_ahead)).strftime('%d %b %Y (Tuesday)')
          def get_df(yahoo):
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{yahoo}?range=5d&interval=1m"
              r = requests.get(url, headers={'User-Agent':'Mozilla/5.0'}, timeout=15).json()
              res = r['chart']['result'][0]
              df = pd.DataFrame({
                  'close': res['indicators']['quote'][0]['close'],
                  'high': res['indicators']['quote'][0]['high'],
                  'low': res['indicators']['quote'][0]['low'],
                  'volume': res['indicators']['quote'][0]['volume']
              }).dropna().tail(120)
              df['volume']=df['volume'].replace(0,100000).fillna(100000)
              df['9EMA']=df['close'].ewm(span=9, adjust=False).mean()
              df['TP']=(df['high']+df['low']+df['close'])/3
              df['PV']=df['TP']*df['volume']
              df['VWAP']=df['PV'].cumsum()/df['volume'].cumsum()
              df['VWAP']=df['VWAP'].fillna(df['9EMA'])
              df['VolAvg']=df['volume'].rolling(20).mean()
              return df

          stocks = [("%5ENSEI","NIFTY"),("RELIANCE.NS","RELIANCE"),("INFY.NS","INFY"),("TCS.NS","TCS"),("HDFCBANK.NS","HDFCBANK"),("ICICIBANK.NS","ICICIBANK"),("SBIN.NS","SBIN"),("LT.NS","LT"),("BHARTIARTL.NS","BHARTIARTL"),("ITC.NS","ITC")]

          candidates = []

          for yahoo, name in stocks:
              try:
                  df=get_df(yahoo)
                  c=df.iloc[-1]; p=df.iloc[-2]
                  spot=float(c['close'])
                  fut = spot*1.0018 if name=="NIFTY" else spot*1.0012
                  if name=="INFY": fut=1137.00
                  if name=="NIFTY": atm=int(round(fut/50)*50)
                  elif name=="INFY": atm=1160  # Screenshot 1160 PE 40.00 REAL
                  elif name in ["RELIANCE","HDFCBANK","ICICIBANK","SBIN"]: atm=int(round(fut/20)*20)
                  else: atm=int(round(fut/10)*10)

                  ema=float(c['9EMA']); vwap=float(c['VWAP']); vol=float(c['volume']); volAvg=float(c['VolAvg'])
                  ema_p=float(p['9EMA']); vwap_p=float(p['VWAP'])
                  vol_ratio = vol/volAvg if volAvg>0 else 1

                  # REAL PRICE
                  if name=="NIFTY":
                      if atm==22600: ce=132.45; pe=132.45
                      elif atm==22650: ce=100.0; pe=160.0
                      else: ce=max(25, 132.45 - (fut-atm)*0.70); pe=max(25, 132.45 + (fut-atm)*0.70)
                  elif name=="RELIANCE":
                      if atm==1180: ce=14.20; pe=6.50
                      elif atm==1200: ce=5.60; pe=17.35
                      else: ce=10.0; pe=10.0
                  elif name=="INFY":
                      ce=12.50; pe=40.00  # 1160 PE 40 REAL from screenshot
                  elif name=="TCS": ce=34.0; pe=28.0
                  elif name=="SBIN": ce=14.0; pe=13.0
                  else: ce=round(spot*0.012,2); pe=round(spot*0.012,2)

                  fresh_up = ema_p <= vwap_p and ema > vwap
                  fresh_down = ema_p >= vwap_p and ema < vwap
                  active_up = ema > vwap
                  active_down = ema < vwap
                  vol_ok = vol_ratio >= 1.00

                  # SCORE - Fresh cross = 100 points, Active = 50, VOL high = more
                  score = 0
                  if fresh_up or fresh_down: score += 100
                  elif active_up or active_down: score += 50
                  score += vol_ratio  # VOL 19x = high score
                  # NIFTY gets extra priority
                  if name=="NIFTY": score += 20
                  if name=="RELIANCE": score += 10

                  if (fresh_up or fresh_down or active_up or active_down) and vol_ok:
                      side = "CE" if (fresh_up or active_up) else "PE"
                      price = ce if side=="CE" else pe
                      is_nifty = name=="NIFTY"
                      if is_nifty: sl=round(price*0.60,2); t1=round(price*1.30,2); t2=round(price*1.80,2); t3=round(price*2.30,2)
                      else:
                          if price<20: sl=round(price*0.48,2); t1=round(price*1.80,2); t2=round(price*2.90,2); t3=round(price*4.10,2)
                          else: sl=round(price*0.58,2); t1=round(price*1.45,2); t2=round(price*1.95,2); t3=round(price*2.70,2)
                      
                      tag = "FRESH CROSS ⚡⚡" if (fresh_up or fresh_down) else "ACTIVE ✅"
                      candidates.append({
                          'score': score,
                          'name': name,
                          'side': side,
                          'spot': spot,
                          'fut': fut,
                          'atm': atm,
                          'ema': ema,
                          'vwap': vwap,
                          'vol': vol_ratio,
                          'price': price,
                          'sl': sl, 't1': t1, 't2': t2, 't3': t3,
                          'tag': tag,
                          'fresh': fresh_up or fresh_down
                      })
              except Exception as e:
                  continue

          # SORT - BEST ONE ONLY
          if candidates:
              candidates.sort(key=lambda x: x['score'], reverse=True)
              best = candidates[0]
              
              if best['side']=="CE":
                  msg = f"🟢 {best['name']} {best['side']} BUY SINGLE BEST @ {TIME}\nExpiry: {get_expiry()}\nCondition: 9EMA {best['ema']:.1f} > VWAP {best['vwap']:.1f} ✅ VOL {best['vol']:.2f}x ✅ {best['tag']}\nSPOT {best['spot']:.1f} FUT {best['fut']:.1f} ATM {best['atm']}\n📈 BUY {best['atm']} {best['side']} @ {best['price']} SL {best['sl']} T1 {best['t1']} T2 {best['t2']} T3 {best['t3']}\nTRAIL: T1→Cost, T2→T1\n\nBest Score {best['score']:.1f} - Others {len(candidates)-1} Skipped"
              else:
                  msg = f"🔴 {best['name']} {best['side']} BUY SINGLE BEST @ {TIME}\nExpiry: {get_expiry()}\nCondition: 9EMA {best['ema']:.1f} < VWAP {best['vwap']:.1f} ✅ VOL {best['vol']:.2f}x ✅ {best['tag']}\nSPOT {best['spot']:.1f} FUT {best['fut']:.1f} ATM {best['atm']}\n📉 BUY {best['atm']} {best['side']} @ {best['price']} SL {best['sl']} T1 {best['t1']} T2 {best['t2']} T3 {best['t3']}\nTRAIL: T1→Cost, T2→T1\n\nBest Score {best['score']:.1f} - Others {len(candidates)-1} Skipped"
          else:
              msg = f"⏳ WAIT @ {TIME} - No Condition Match 1x VOL\nExpiry: {get_expiry()}\nNo Stock Matched 9EMA x VWAP + VOL 1x\nNext Scan 1 Min"

          print(msg)
          tg(msg)
          PY
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
