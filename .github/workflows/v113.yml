name: V113 566 FINAL - INTRADAY ONLY 9:15-3:00
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 3-9 * * 1-5'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pip install
        run: pip install requests pytz pandas -q
      - name: Run Scanner
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python << 'PY'
          import requests, pytz, os, traceback
          from datetime import datetime
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.parse import quote
          import pandas as pd
          
          IST = pytz.timezone('Asia/Kolkata')
          now = datetime.now(IST)
          TIME = now.strftime('%H:%M:%S')
          BOT = os.getenv("BOT_TOKEN")
          CHAT = os.getenv("CHAT_ID")
          
          def tg(m):
              try:
                  requests.post(f"https://api.telegram.org/bot{BOT}/sendMessage", data={"chat_id": CHAT, "text": m}, timeout=10)
              except Exception as e:
                  print(f"TG Error {e}")
          
          try:
              # SAFE LIST - & असलेले काढले
              STOCKS = ["360ONE","AARTIIND","ABB","ADANIENT","ADANIGREEN","ADANIPORTS","ADANIPOWER","ATGL","AWL","ABCAPITAL","AEGISLOG","AETHER","AFFLE","AJANTPHARM","APLLTD","ALKEM","ALKYLAMINE","AMBER","AMBUJACEM","ANANDRATHI","ANANTRAJ","ANGELONE","APARINDS","APOLLOHOSP","APOLLOTYRE","ASAHIINDIA","ASHOKLEY","ASIANPAINT","ASTERDM","ASTRAL","ATUL","AUBANK","AURIONPRO","AUROPHARMA","AVANTIFEED","DMART","AXISBANK","BEML","BSE","BAJAJ-AUTO","BAJFINANCE","BAJAJFINSV","BALKRISIND","BALRAMCHIN","BANDHANBNK","BANKBARODA","BANKINDIA","MAHABANK","BATAINDIA","BERGEPAINT","BDL","BEL","BHARATFORG","BHEL","BPCL","BHARTIARTL","BIOCON","BSOFT","BLUEDART","BRIGADE","BRITANNIA","CCL","CESC","CAMPUS","CGPOWER","CAMS","CANFINHOME","CANBK","CAPLIPOINT","CARBORUNIV","CASTROLIND","CEATLTD","CELLO","CENTRALBK","CDSL","CENTURYPLY","CERA","CHALET","CHAMBLFERT","CHOLAFIN","CUB","CIPLA","COFORGE","COLPAL","CONCOR","COROMANDEL","CRAFTSMAN","CREDITACC","CRISIL","CROMPTON","CUMMINSIND","CYIENT","DALBHARAT","DATAPATTNS","DEEPAKFERT","DEEPAKNTR","DELHIVERY","DEVYANI","DIVISLAB","DIXON","DLF","DRREDDY","EICHERMOT","ELGIEQUIP","ELECON","EMAMILTD","ENDURANCE","EPL","EQUITASBNK","ERIS","ESCORTS","EXIDEIND","FEDERALBNK","FINEORG","FINCABLES","FSL","FIVESTAR","FORTIS","GAIL","GICRE","GLAND","GLENMARK","GODREJCP","GODREJPROP","GRANULES","GRAPHITE","GRASIM","GUJGASLTD","GSPL","HCLTECH","HDFCAMC","HDFCBANK","HDFCLIFE","HFCL","HAPPSTMNDS","HAVELLS","HEROMOTOCO","HINDALCO","HAL","HINDCOPPER","HINDPETRO","HINDZINC","HOMEFIRST","HONAUT","HUDCO","ICICIBANK","ICICIGI","ICICIPRULI","IDBI","IDFCFIRSTB","IEX","IPCALAB","INDHOTEL","INDIAMART","INDIANB","ISEC","INDUSINDBK","NAUKRI","INFY","INTELLECT","IOC","IOB","IRB","ITC","JKTYRE","JINDALSTEL","JINDALSTAIN","JIOFIN","JSWENERGY","JSWSTEEL","JUBILANT","JUBLFOOD","KPRMILL","KPITTECH","KRBL","KIMS","LAURUSLABS","LTF","LT","LTTS","LICHSGFIN","LICI","LUPIN","MANAPPURAM","MRF","MGL","MAZDOCK","METROPOLIS","MPHASIS","MRPL","MUTHOOTFIN","NH","NATCOPHARM","NATIONALUM","NAVI