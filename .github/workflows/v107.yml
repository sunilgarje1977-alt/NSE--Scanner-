name: V107 NIFTY PRIORITY ACTIVE - 566 STOCKS
on:
  workflow_dispatch:
  schedule:
    - cron: '*/3 3-10 * * 1-5'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz pandas -q
      - name: Run V107 566 Scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python << 'PY'
          import requests, pytz, pandas as pd, os
          from datetime import datetime, timedelta
          IST = pytz.timezone('Asia/Kolkata')
          now = datetime.now(IST)
          TIME = now.strftime('%H:%M:%S')
          BOT = os.getenv('BOT_TOKEN')
          CHAT = os.getenv('CHAT_ID')
          def tg(m):
              try: requests.post(f'https://api.telegram.org/bot{BOT}/sendMessage', data={'chat_id': CHAT, 'text': m}, timeout=10)
              except: pass
          def exp():
              d=now.date()
              da=1-d.weekday()
              if da<0: da+=7
              if da==0 and now.hour>=16: da=7
              return (d+timedelta(days=da)).strftime('%d %b %Y')
          def get_df(y):
              try:
                  url=f"https://query1.finance.yahoo.com/v8/finance/chart/{y}.NS?range=2d&interval=1m"
                  r=requests.get(url, headers={'User-Agent':'Mozilla/5.0'}, timeout=10).json()
                  res=r['chart']['result'][0]
                  df=pd.DataFrame({'c':res['indicators']['quote'][0]['close'],'v':res['indicators']['quote'][0]['volume'],'h':res['indicators']['quote'][0]['high'],'l':res['indicators']['quote'][0]['low']}).dropna().tail(80)
                  df['9EMA']=df['c'].ewm(span=9,adjust=False).mean()
                  df['15EMA']=df['c'].ewm(span=15,adjust=False).mean()
                  df['TP']=(df['h']+df['l']+df['c'])/3
                  df['PV']=df['TP']*df['v']
                  df['VWAP']=df['PV'].cumsum()/df['v'].cumsum()
                  return df
              except: return None
          from stocks_566 import STOCKS_566
          for sym in STOCKS_566:
              df=get_df(sym)
              if df is None or len(df)<30: continue
              e9=df['9EMA'].iloc[-1]; e15=df['15EMA'].iloc[-1]; vwap=df['VWAP'].iloc[-1]
              pe9=df['9EMA'].iloc[-2]; pe15=df['15EMA'].iloc[-2]; pvwap=df['VWAP'].iloc[-2]
              ltp=df['c'].iloc[-1]
              buy = (e9 > e15 and pe9 <= pe15) and (e9 > vwap and pe9 <= pvwap)
              sell = (e9 < e15 and pe9 >= pe15) and (e9 < vwap and pe9 >= pvwap)
              if buy: tg(f"🟢 {sym} BUY @ {ltp:.2f} ACTIVE\n9EMA Cross UP 15EMA + VWAP ✅\nTime: {TIME} IST\nExp: {exp()}")
              if sell: tg(f"🔴 {sym} SELL @ {ltp:.2f} ACTIVE\n9EMA Cross DOWN 15EMA + VWAP ✅\nTime: {TIME} IST\nExp: {exp()}")
          PY 
