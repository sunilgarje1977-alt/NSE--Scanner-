name: FINAL v6.1 Small Cap Fix
on:
  schedule:
    # LAYER-2 FULL 1000 - 9:15 ते 10:30 IST (3:45-5:00 UTC)
    - cron: '45,48,51,54,57 3 * * 1-5'
    - cron: '0,3,6,9,12,15,18,21,24,27,30 4 * * 1-5'
    # LAYER-1 FAST - 10:30 नंतर (5:00 UTC नंतर)
    - cron: '35,40,45,50,55 4 * * 1-5'
    - cron: '0,10,20,30,40,50 5-9 * * 1-5'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with: {python-version: '3.10'}
      - run: pip install -r requirements.txt
      - env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py
