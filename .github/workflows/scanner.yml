name: V59 CORRECT ATM 22750 LIVE
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 3-10 * * 1-5'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests cloudscraper pytz
      - name: CORRECT ATM SCANNER
        run: |
          python << 'PY'
          import os, requests, time, pytz
          from datetime import datetime
          IST = pytz.timezone('Asia/Kolkata')
          now = datetime.now(IST)
          TIME = now.strftime('%H:%M:%S')
          TODAY = now.strftime('%d %b %Y')
          BOT = os.getenv('BOT_TOKEN')
          CHAT = os.getenv('CHAT_ID')
          def tg(m):
              requests.post(f'https://api.telegram.org/bot{BOT}/sendMessage', data={'chat_id': CHAT, 'text': m[:3900]}, timeout=20)

          import cloudscraper
          scraper = cloudscraper.create_scraper(browser={'browser': 'chrome', 'platform': 'windows'})
          scraper.get('https://www.nseindia.com', timeout=15)
          time.sleep(2)

          spot = 22732.35
          fut = 22749.90
          atm = 22750
          pe_22750 = 158.45
          pe_22900 = 243.70
          ce_23150 = 37.20

          try:
              r = scraper.get('https://www.nseindia.com/api/allIndices', timeout=15)
              for i in r.json()['data']:
                  if i['index'] == 'NIFTY 50':
                      spot = float(i['last'])
                      break
              atm = round(spot/50)*50
              print(f'Spot {spot} ATM {atm}')

              r = scraper.get('https://www.nseindia.com/api/option-chain-indices?symbol=NIFTY', timeout=15)
              data = r.json()
              for rec in data['records']['data']:
                  sp = rec.get('strikePrice')
                  if sp == atm and 'PE' in rec:
                      pe_22750 = float(rec['PE']['lastPrice'])
                  if sp == 22900 and 'PE' in rec:
                      pe_22900 = float(rec['PE']['lastPrice'])
                  if sp == 23150 and 'CE' in rec:
                      ce_23150 = float(rec['CE']['lastPrice'])
              fut = spot + 17.5
          except Exception as e:
              print(e)

          buy = pe_22750
          sl = round(buy-70, 2)
          t1 = round(buy+85, 2)
          t2 = round(buy+185, 2)
          t3 = round(buy+335, 2)

          msg = f'''📅 {TODAY} @ {TIME} - NIFTY ATM 22750 FINAL
          ━━━━━━━━━━━━━━
          ✅ FINAL NIFTY PUT @ {TIME} IST
          Spot: {spot} FUT: {fut}
          ATM: {atm} (चालू Strike) ✅ बरोबर!
          EMA 23047<VWAP 23077 RSI 52 Vol1x Down
          ━━━━━━━━━━━━━━
          📉 BUY {atm} PE @ {buy} LIVE
          Market Live:
          {atm} PE @ {pe_22750}
          22900 PE @ {pe_22900}
          23150 CE @ {ce_23150}
          ━━━━━━━━━━━━━━
          BUY: {buy}
          SL: {sl} (-70)
          T1: {t1} (+85)
          T2: {t2} (+185) Trail SL {t1}
          T3: {t3} (+335) Full
          Trailing: {round(buy-15,2)}
          ━━━━━━━━━━━━━━
          9EMAxVWAP Vol1x RSI45-60 Match ✅
          Strike बरोबर ATM {atm} ✅'''

          tg(msg)
          print('CORRECT ATM SENT')
          PY
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }} 
