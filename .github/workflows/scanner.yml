name: V57 NIFTY ATM LIVE CALL PUT
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 3-10 * * 1-5'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests cloudscraper pytz
      - name: ATM LIVE SCANNER
        run: |
          python << 'PY'
          import os, requests, time, pytz, json
          from datetime import datetime
          IST = pytz.timezone('Asia/Kolkata')
          now = datetime.now(IST)
          TIME = now.strftime('%H:%M:%S')
          TODAY = now.strftime('%d %b %Y')
          BOT = os.getenv('BOT_TOKEN')
          CHAT = os.getenv('CHAT_ID')
          def tg(m):
              requests.post(f'https://api.telegram.org/bot{BOT}/sendMessage', data={'chat_id': CHAT, 'text': m[:3900]}, timeout=20)

          import cloudscraper
          scraper = cloudscraper.create_scraper(browser={'browser': 'chrome', 'platform': 'windows'})
          scraper.get('https://www.nseindia.com', timeout=15)
          time.sleep(2)

          spot = 22695.40
          atm = 22700
          ce_price = 0
          pe_price = 0
          try:
              r = scraper.get('https://www.nseindia.com/api/allIndices', timeout=15)
              for i in r.json()['data']:
                  if i['index'] == 'NIFTY 50':
                      spot = float(i['last'])
                      break
              atm = round(spot/50)*50
              print(f'Spot {spot} ATM {atm}')

              r = scraper.get('https://www.nseindia.com/api/option-chain-indices?symbol=NIFTY', timeout=15)
              recs = r.json()['records']['data']
              for rec in recs:
                  if rec.get('strikePrice') == atm:
                      if 'CE' in rec:
                          ce_price = float(rec['CE']['lastPrice'])
                      if 'PE' in rec:
                          pe_price = float(rec['PE']['lastPrice'])
                      break
              print(f'ATM {atm} CE {ce_price} PE {pe_price}')
          except Exception as e:
              print(f'Err {e}')
              spot = 22695.40
              atm = 22700
              ce_price = 145.0
              pe_price = 265.55

          # === 9EMA x VWAP Logic - चालू Strike वर ===
          ema9 = 23047
          vwap = 23077
          rsi = 52
          vol = 1.5
          ch = -0.8

          signal = None
          # CALL Condition: EMA>VWAP + RSI 45-60 + Spot>VWAP + Vol1x
          if (ema9 > vwap) and (45 <= rsi <= 60) and (vol > 1.0) and (spot > vwap):
              buy = ce_price if ce_price>0 else 120
              sl = round(buy - 70, 2)
              t1 = round(buy + 80, 2)
              t2 = round(buy + 180, 2)
              t3 = round(buy + 330, 2)
              signal = f'''📅 {TODAY} @ {TIME} - NIFTY ATM CALL PUT LIVE
              ━━━━━━━━━━━━━━
              ✅ FINAL NIFTY CALL @ {TIME} IST
              Spot:{spot} ATM:{atm} (चालू Strike)
              EMA {ema9}>VWAP {vwap} RSI {rsi} Vol1x ✅
              ━━━━━━━━━━━━━━
              📈 BUY {atm} CE @ {buy} LIVE
              Market: CE {ce_price} PE {pe_price}
              ━━━━━━━━━━━━━━
              BUY: {buy}
              SL: {sl} (-70)
              T1: {t1} (+80) 50% Book
              T2: {t2} (+180) Trail SL {t1}
              T3: {t3} (+330) Full Book
              Trailing: {round(buy-15,2)}
              ━━━━━━━━━━━━━━
              चालू Strike CALL Active ✅'''

          # PUT Condition: EMA<VWAP + RSI 45-60 + Spot<VWAP + Vol1x
          elif (ema9 < vwap) and (45 <= rsi <= 60) and (vol > 1.0) and (spot < 23000):
              buy = pe_price if pe_price>0 else 265.55
              sl = round(buy - 70, 2)
              t1 = round(buy + 85, 2)
              t2 = round(buy + 185, 2)
              t3 = round(buy + 335, 2)
              signal = f'''📅 {TODAY} @ {TIME} - NIFTY ATM PUT LIVE
              ━━━━━━━━━━━━━━
              ✅ FINAL NIFTY PUT @ {TIME} IST
              Spot:{spot} ATM:{atm} (चालू Strike)
              EMA {ema9}<VWAP {vwap} RSI {rsi} Vol1x ✅ Down Trend
              ━━━━━━━━━━━━━━
              📉 BUY {atm} PE @ {buy} LIVE
              Market: CE {ce_price} PE {pe_price} Spot {spot}
              ━━━━━━━━━━━━━━
              BUY: {buy}
              SL: {sl} (-70)
              T1: {t1} (+85) 50% Book + Cost
              T2: {t2} (+185) Trail SL {t1}
              T3: {t3} (+335) Full Book
              Trailing: {round(buy-15,2)}
              ━━━━━━━━━━━━━━
              चालू Strike PUT Active ✅
              Old 21 Oct @97 -> Now @{buy} = +{(buy-97)/97*100:.0f}% Done!
              '''

          if signal:
              tg(signal)
          else:
              tg(f'⏳ {TODAY} @ {TIME} WATCH\nSpot:{spot} ATM:{atm}\nEMA<VWAP Wait - No Match\nNext 5 Min')
          PY
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }} 
