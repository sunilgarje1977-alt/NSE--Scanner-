name: NSE 5000 Final V3
on:
  schedule:
    - cron: '8 3 * * 1-5'
    - cron: '15 3 * * 1-5'
    - cron: '30 5 * * 1-5'
    - cron: '5 10 * * 1-5'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with: {python-version: '3.9'}
      - run: pip install pandas SmartApi-python pyotp requests logzero
      - run: |
          H=$(date +%H)
          if [ $H -eq 10 ]; then python summary.py; else python scanner.py; fi
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add trades_state.json || true
          git commit -m "update" || true
          git push || true
