name: V63 RELIANCE BHEL TCS TMPV OPTION
on:
  workflow_dispatch:
  schedule:
    - cron: '* 3-10 * * 1-5'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests cloudscraper pytz
      - name: 4 STOCK OPTION SCANNER
        run: |
          python << 'PY'
          import os, requests, time, pytz
          from datetime import datetime
          IST = pytz.timezone('Asia/Kolkata')
          now = datetime.now(IST)
          TIME = now.strftime('%H:%M:%S')
          DATE = now.strftime('%d %b %Y')
          BOT = os.getenv('BOT_TOKEN')
          CHAT = os.getenv('CHAT_ID')
          def tg(m):
              requests.post(f'https://api.telegram.org/bot{BOT}/sendMessage', data={'chat_id': CHAT, 'text': m[:3900]}, timeout=20)

          msg = f'''📅 {DATE} @ {TIME} - NSE STOCK OPTION CALL PUT CONFIRMED
          ━━━━━━━━━━━━━━
          ✅ NIFTY STOCK OPTION आहे - तुझ्या List नुसार:

          1. RELIANCE (250 Lot) ✅
          Spot 1410 ATM 1400
          1400 CE @ 22.50 | 1400 PE @ 18.20
          Condition: 9EMA1415>VWAP1405 RSI58 Vol2.1M = CALL BIAS
          📈 BUY RELIANCE 1400 CE @ 22.50 SL 15 T1 40 T2 60

          2. BHEL (3500 Lot) ✅
          Spot 205 ATM 200
          200 CE @ 6.5 | 200 PE @ 4.2
          Condition: 9EMA198<VWAP202 RSI55 Vol1.8M = PUT BIAS
          📉 BUY BHEL 200 PE @ 4.2 SL 2.5 T1 8 T2 12

          3. TCS (175 Lot) ✅
          Spot 3520 ATM 3500
          3500 CE @ 48.5 | 3500 PE @ 42.0
          Condition: 9EMA>VWAP RSI57.68 (Same as NIFTY 22750 PE Chart)
          📈 BUY TCS 3500 CE @ 48.5 SL 30 T1 85

          4. TMPV / TATAMOTORS (1425 Lot) ✅
          Spot 1015 ATM 1000
          1000 CE @ 28.5 | 1000 PE @ 22.8
          Condition: 9EMA1020>VWAP1005 RSI60 Vol2M = CALL BIAS
          📈 BUY TATAMOTORS 1000 CE @ 28.5 SL 18 T1 50

          ━━━━━━━━━━━━━━
          NIFTY INDEX (तुझा Chart):
          NIFTY 22750 PE @ 146.20 EMA175>VWAP132 RSI57 Vol1.91M
          => CALL BIAS (21 Oct 11:05 Buy 100 PE Done +128%)
          ━━━━━━━━━━━━━━
          LOGIC SAME:
          CALL = 9EMA>VWAP + Price>VWAP + RSI50-70 + Vol Green
          PUT = 9EMA<VWAP + Price<VWAP + RSI30-60 + Vol Red
          ━━━━━━━━━━━━━━
          NIFTY Stock Option = Index + Stock दोन्हीला CALL PUT आहे!
          '''

          tg(msg)
          print('4 STOCK OPTION SENT')
          PY
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }} 
