name: ANGEL NSE 1000 PRO
on:
  schedule:
    - cron: '*/2 3-10 * * 1-5'
    - cron: '5 10 * * 1-5'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install smartapi-python pyotp pandas requests logzero pycryptodome websocket-client
      - name: Run scanner
        env:
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanner.py
      - name: Save trades
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add trades.json || true
          git commit -m "update" || true
          git push || true
