name: V48 9EMA VWAP RSI FINAL
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 3-10 * * 1-5'
concurrency: { group: v48-final, cancel-in-progress: true }
permissions: { contents: write }
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests cloudscraper pytz
      - name: Test Telegram + Scanner
        run: |
          python -c "
          import os, requests
          BOT=os.getenv('BOT') or os.getenv('TELEGRAM_BOT_TOKEN')
          CHAT=os.getenv('CHAT') or os.getenv('TELEGRAM_CHAT_ID')
          print(f'BOT:{BOT[:10]}... CHAT:{CHAT}')

          # 1. TEST MESSAGE - हा 100% यायलाच पाहिजे
          try:
              r=requests.post(f'https://api.telegram.org/bot{BOT}/sendMessage', data={'chat_id':CHAT,'text':'✅ V48 TEST OK - Telegram Connected @ 10:17\nBot Working - Scanner Active'}, timeout=15)
              print(f'Test Response:{r.text[:200]}')
          except Exception as e:
              print(f'Test Err {e}')

          # 2. SCANNER LOGIC
          import cloudscraper, pytz, time
          from datetime import datetime
          IST=pytz.timezone('Asia/Kolkata')
          now=datetime.now(IST)
          def tg(m):
              requests.post(f'https://api.telegram.org/bot{BOT}/sendMessage', data={'chat_id':CHAT,'text':m}, timeout=20)

          scraper=cloudscraper.create_scraper()
          scraper.get('https://www.nseindia.com', timeout=10)
          try:
              data=scraper.get('https://www.nseindia.com/api/equity-stockIndices?index=NIFTY%20100', timeout=15).json()['data']
              calls=len([s for s in data if float(s.get('pChange',0))>=1.0])
              puts=len([s for s in data if float(s.get('pChange',0))<=-1.0])
              tg(f'⏰ V48 SCAN @ {now.strftime(\"%H:%M:%S\")}\nNIFTY100 Check Done\nCALL Stocks:{calls}\nPUT Stocks:{puts}\n9EMAxVWAP Vol1x RSI45-60 Logic Active\n(1% Move नसल्याने Watch Mode)')
              print('Scan Done')
          except Exception as e:
              tg(f'❌ V48 Error {e}')
              print(e)
          "
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
