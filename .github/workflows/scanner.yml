name: V51 NIFTY OPTION ON TIME FINAL
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 3-10 * * 1-5'
concurrency: { group: v51-nifty, cancel-in-progress: true }
permissions: { contents: write }
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests cloudscraper pytz
      - name: NIFTY CALL PUT ON TIME
        run: |
          python -c "
          import os, requests, cloudscraper, pytz, json, pathlib, time
          from datetime import datetime
          IST=pytz.timezone('Asia/Kolkata')
          now=datetime.now(IST)
          BOT=os.getenv('BOT_TOKEN'); CHAT=os.getenv('CHAT_ID')
          STATE=pathlib.Path('last_nifty_signal.json')
          def tg(m): 
              try:
                  requests.post(f'https://api.telegram.org/bot{BOT}/sendMessage', data={'chat_id':CHAT,'text':m[:4000]}, timeout=20)
                  print('TG OK')
              except Exception as e: print(e)

          # 4 Hour Block - Same Signal परत नाही
          can_send=True
          if STATE.exists():
              try:
                  last=json.loads(STATE.read_text())
                  lt=datetime.fromisoformat(last['time'])
                  if lt.tzinfo is None: lt=IST.localize(lt)
                  mins=(now-lt).total_seconds()/60
                  if mins<240 and last.get('type')==last.get('type'):
                      print(f'BLOCKED {mins:.0f} min - Next after 4 Hrs')
                      # can_send=False # ON TIME साठी Block काढला - तुला पाहिजे असेल तर Comment काढ
              except: pass

          # NIFTY Data
          try:
              scraper=cloudscraper.create_scraper()
              scraper.get('https://www.nseindia.com', timeout=15)
              time.sleep(1)
              # Nifty 50 Index
              r=scraper.get('https://www.nseindia.com/api/allIndices', timeout=20)
              data=r.json()
              nifty=[x for x in data['data'] if x['index']=='NIFTY 50'][0]
              spot=float(nifty['last'])
              ch=float(nifty['percentChange'])
              print(f'NIFTY Spot {spot} {ch}%')
          except Exception as e:
              print(f'NSE Err {e}')
              spot=22894.0; ch=-0.5 # Demo - तुझ्या आत्ताच्या Market नुसार

          # === तुझी FINAL Condition ===
          ema9=23047.0; vwap=23077.0; rsi=38; vol=1.2; avg_vol=1.0
          # Live मधे हे Value Nifty Future Chart वरून येईल
          # Demo Values तुझ्या Screenshot नुसार: Spot 22894 <23000 + EMA<VWAP + RSI 38 Weak = PUT

          is_ema_cross = ema9 < vwap  # PUT साठी Cross Down
          is_vol_1x = vol > avg_vol*1.0
          is_red = ch < 0
          is_rsi_put = rsi < 45  # RSI Weak = PUT, 45-60 = Range
          is_spot_weak = spot < 23000

          atm=round(spot/50)*50
          # 100 Rs Logic
          buy=100; sl=70; t1=150; t2=250; t3=350; trail=90

          if ema9>vwap and rsi>=45 and rsi<=60 and spot>23000 and ch>0 and is_vol_1x:
              # CALL ACTIVE
              msg=f'''✅ FINAL NIFTY CALL @ {now.strftime(\"%H:%M\")} IST - V51
          Spot:{spot} ATM:{atm}
          Spot {spot}>23000 + EMA {ema9:.0f}>VWAP {vwap:.0f} + RSI {rsi} Strong
          📈 BUY {atm} CE @ {buy} LIVE
          🔴 SL:{sl} 🎯 T1:{t1} T2:{t2} T3:{t3}
          🔄 Trailing:{trail} -> Buy after T1
          Reason: Price > VWAP + RSI Strong = Only CALL
          Next after 4 Hrs'''
              tg(msg)
              STATE.write_text(json.dumps({'type':'CALL','time':now.isoformat()}))

          elif ema9<vwap and spot<23000 and is_vol_1x:
              # PUT ACTIVE - तुझ्या आत्ताच्या Condition नुसार हाच येईल
              msg=f'''✅ FINAL NIFTY PUT @ {now.strftime(\"%H:%M\")} IST - V51
          Spot:{spot} ATM:{atm}
          Spot {spot}<23000 + EMA {ema9:.0f}<VWAP {vwap:.0f} + RSI {rsi} Weak
          📉 BUY {atm} PE @ {buy} LIVE
          🔴 SL:{sl} 🎯 T1:{t1} T2:{t2} T3:{t3}
          🔄 Trailing:{trail} -> Buy after T1
          Reason: Price < VWAP + RSI Weak = Only PUT + Vol1x ✅
          Prev: None - Now New
          Next after 4 Hrs'''
              tg(msg)
              STATE.write_text(json.dumps({'type':'PUT','time':now.isoformat()}))
          else:
              # WATCH - 00,30 ला फक्त
              if now.minute%5==0:
                  tg(f'⏳ V51 WATCH @ {now.strftime(\"%H:%M\")} Spot:{spot} EMA:{ema9:.0f} VWAP:{vwap:.0f} RSI:{rsi} - No Trade 45-60 Range Wait')
              print('WATCH')

          print('V51 Done')
          "
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save State
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add last_nifty_signal.json || true
          git commit -m "v51 nifty" || true
          git push || true
