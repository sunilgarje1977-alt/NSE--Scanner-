name: Intraday Top 6 Scanner

on:
  schedule:
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install smartapi-python pyotp pandas requests logzero websocket-client

      - name: Restore Trades State
        run: |
          if [ -f trades_state.json ]; then echo "State Found"; else echo '{"date":"'$(date +%F)'","active":[],"closed":[],"total":0}' > trades_state.json; fi

      - name: Run Scanner
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanner.py

      - name: Save State Back to Repo
        run: |
          git config --global user.name "NSE Bot"
          git config --global user.email "bot@nse.com"
          git add trades_state.json || true
          git diff --staged --quiet || git commit -m "Update trades state $(date +'%H:%M')" || true
          git push || true
