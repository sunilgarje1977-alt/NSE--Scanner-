name: ANGEL NSE 1000 PRO
on: workflow_dispatch
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: |
          echo "CLIENT_ID exists: ${{ secrets.ANGEL_CLIENT_ID != '' }}"
          echo "PASSWORD exists: ${{ secrets.ANGEL_PASSWORD != '' }}"
          echo "TOTP exists: ${{ secrets.ANGEL_TOTP_SECRET != '' }}"
          echo "API_KEY exists: ${{ secrets.ANGEL_API_KEY != '' }}"
          echo "Checking other names:"
          echo "ANGEL_TOTP: ${{ secrets.ANGEL_TOTP != '' }}"
          echo "TOTP_SECRET: ${{ secrets.TOTP_SECRET != '' }}"
