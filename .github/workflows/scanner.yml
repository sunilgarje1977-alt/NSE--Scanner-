name: ANGEL NSE 1000 PRO
on:
  schedule:
    - cron: '*/2 3-10 * * 1-5'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install smartapi-python pyotp pandas requests logzero pycryptodome websocket-client
      - name: Run scanner
        env:
          S1: ${{ secrets.ANGEL_CLIENT_ID }}
          S2: ${{ secrets.CLIENT_ID }}
          S3: ${{ secrets.ANGEL_PASSWORD }}
          S4: ${{ secrets.PASSWORD }}
          S5: ${{ secrets.ANGEL_API_KEY }}
          S6: ${{ secrets.API_KEY }}
          S7: ${{ secrets.ANGEL_TOTP_SECRET }}
          S8: ${{ secrets.ANGEL_TOTP }}
          S9: ${{ secrets.TOTP_SECRET }}
          S10: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          S11: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          clean() { echo "$1" | tr -d '\r\n' | xargs; }
          export ANGEL_CLIENT_ID=$(clean "${S1}${S2}")
          export ANGEL_PASSWORD=$(clean "${S3}${S4}")
          export ANGEL_API_KEY=$(clean "${S5}${S6}")
          export ANGEL_TOTP_SECRET=$(clean "${S7}${S8}${S9}")
          export ANGEL_TOTP=$ANGEL_TOTP_SECRET
          export TELEGRAM_BOT_TOKEN=$(clean "${S10}")
          export TELEGRAM_CHAT_ID=$(clean "${S11}")
          export CLIENT_ID=$ANGEL_CLIENT_ID
          export PASSWORD=$ANGEL_PASSWORD
          export API_KEY=$ANGEL_API_KEY
          export TOTP_SECRET=$ANGEL_TOTP_SECRET
          export BOT_TOKEN=$TELEGRAM_BOT_TOKEN
          export CHAT_ID=$TELEGRAM_CHAT_ID
          echo "TOTP len after clean: ${#ANGEL_TOTP_SECRET}"
          python scanner.py
      - name: Save trades
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add trades.json || true
          git commit -m "update" || true
          git push || true
