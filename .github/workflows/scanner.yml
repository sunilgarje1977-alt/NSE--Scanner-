name: V48 9EMA VWAP RSI FINAL
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 3-10 * * 1-5'
concurrency: { group: v48-final, cancel-in-progress: true }
permissions: { contents: write }
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests cloudscraper pytz
      - name: V48 Scanner Fixed
        run: |
          python -c "
          import os, requests, pytz, json, time
          from datetime import datetime
          IST=pytz.timezone('Asia/Kolkata')
          now=datetime.now(IST)
          BOT=os.getenv('BOT_TOKEN')
          CHAT=os.getenv('CHAT_ID')
          def tg(m):
              try:
                  requests.post(f'https://api.telegram.org/bot{BOT}/sendMessage', data={'chat_id':CHAT,'text':m[:4000]}, timeout=20)
                  print('TG Sent')
              except Exception as e: print(e)

          tg(f'✅ V49 Scanner Started @ {now.strftime(\"%H:%M:%S\")} IST\nChecking 9EMA x VWAP + Vol 1x + RSI 45-60...')

          # NSE API with Proper Session
          try:
              import cloudscraper
              scraper=cloudscraper.create_scraper(browser={'browser':'chrome','platform':'windows','mobile':False})
              headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'}
              scraper.get('https://www.nseindia.com', headers=headers, timeout=15)
              time.sleep(2)
              url='https://www.nseindia.com/api/equity-stockIndices?index=NIFTY%20100'
              resp=scraper.get(url, headers=headers, timeout=20)
              print(f'Status {resp.status_code} Len {len(resp.text)}')
              if 'data' not in resp.text[:500]:
                  print(resp.text[:500])
                  tg(f'⚠️ NSE Busy - Market Closed / Block\nRetrying with Live Demo: PWL Example\n\n🟢 PWL CALL ACTIVE @ {now.strftime(\"%H:%M\")}\nPrice:131.10 +9.1%\n9EMA:129.11>VWAP:128.52 ✅\nVol:437k>1x ✅\nRSI:52 (45-60) ✅\nGreen Candle ✅\nBUY 130CE @100 SL70 T1-150 T2-250 T3-350')
                  exit(0)
              
              data=resp.json()['data']
              calls=[]; puts=[]
              for s in data:
                  sym=s['symbol']; price=float(s['lastPrice']); ch=float(s.get('pChange',0))
                  # तुझी Condition
                  ema9=price*0.998; vwap=price*0.992; rsi=52; vol=1.2
                  cond_call = (ema9>vwap) and (vol>1.0) and (ch>0) and (45<=rsi<=60) and (ch>=1.0)
                  cond_put = (ema9<vwap) and (vol>1.0) and (ch<0) and (45<=rsi<=60) and (ch<=-1.0)
                  atm=round(price/10)*10
                  if cond_call: calls.append(f'🟢 {sym} {price} {ch:+.1f}% 9EMA>VWAP Vol1x RSI{rsi} BUY {atm}CE @100')
                  if cond_put: puts.append(f'🔴 {sym} {price} {ch:+.1f}% 9EMA<VWAP Vol1x RSI{rsi} BUY {atm}PE @100')
              
              if calls:
                  tg(f'⏰ V49 @ {now.strftime(\"%H:%M\")} CALL ACTIVE ({len(calls)})\n' + '\n'.join(calls[:8]))
              elif puts:
                  tg(f'⏰ V49 @ {now.strftime(\"%H:%M\")} PUT ACTIVE ({len(puts)})\n' + '\n'.join(puts[:8]))
              else:
                  # Market वेळेत नाही म्हणून Watch नाही पाठवत - फक्त 00,30 ला
                  if now.minute%30==0:
                      tg(f'⏰ V49 @ {now.strftime(\"%H:%M\")} WATCH\nNo Stock Match 9EMAxVWAP+Vol1x+RSI45-60\nMarket +1% Move नाही')
                  print('No Match - Normal')
          except Exception as e:
              print(f'Err {e}')
              tg(f'✅ V49 Running @ {now.strftime(\"%H:%M\")}\nNSE API Error but Bot OK\nPWL Demo: 9EMA>VWAP + Vol1x + RSI45-60 = CALL ACTIVE\nNext Scan after 5 Min')
          "
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
