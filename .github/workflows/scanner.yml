name: ANGEL NSE 1000 PRO
on:
  schedule:
    - cron: '*/2 3-10 * * 1-5'
    - cron: '5 10 * * 1-5'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install smartapi-python pyotp pandas requests logzero pycryptodome websocket-client
      - name: Run scanner
        run: |
          CLIENT_ID=$(echo "${{ secrets.ANGEL_CLIENT_ID }}${{ secrets.CLIENT_ID }}" | tr -d '\r\n' | xargs)
          PASSWORD=$(echo "${{ secrets.ANGEL_PASSWORD }}${{ secrets.PASSWORD }}" | tr -d '\r\n' | xargs)
          API_KEY=$(echo "${{ secrets.ANGEL_API_KEY }}${{ secrets.API_KEY }}" | tr -d '\r\n' | xargs)
          TOTP_SECRET=$(echo "${{ secrets.ANGEL_TOTP_SECRET }}${{ secrets.ANGEL_TOTP }}${{ secrets.TOTP_SECRET }}" | tr -d '\r\n' | xargs)
          export CLIENT_ID PASSWORD API_KEY TOTP_SECRET
          export ANGEL_CLIENT_ID=$CLIENT_ID
          export ANGEL_PASSWORD=$PASSWORD
          export ANGEL_API_KEY=$API_KEY
          export ANGEL_TOTP_SECRET=$TOTP_SECRET
          export ANGEL_TOTP=$TOTP_SECRET
          python scanner.py
      - run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add trades.json || true
          git commit -m "update" || true
          git push || true
