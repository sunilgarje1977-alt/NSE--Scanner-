name: NSE 750 LIVE
on:
  schedule:
    - cron: '15 3 * * 1-5'  # 08:45 IST Pre-Market
    - cron: '30 3 * * 1-5'  # 09:00 IST
    - cron: '45 3 * * 1-5'  # 09:15 IST OPEN
    - cron: '0 4 * * 1-5'   # 09:30 IST
    - cron: '15 4 * * 1-5'  # 09:45 IST
    - cron: '30 4 * * 1-5'  # 10:00 IST
    - cron: '0 5 * * 1-5'   # 10:30 IST
    - cron: '0 6 * * 1-5'   # 11:30 IST
    - cron: '0 8 * * 1-5'   # 13:30 IST
    - cron: '45 9 * * 1-5'  # 15:15 IST CLOSE
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas SmartApi-python pyotp requests logzero websocket-client
      - run: python scanner.py
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
