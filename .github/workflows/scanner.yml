name: NSE 1MIN Real Time
on:
  workflow_dispatch:
  schedule:
    - cron: '*/3 3-10 * * 1-5'
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install
        run: pip install requests cloudscraper pytz pandas
      - name: Run 1Min Live Scanner - Call Put Both With Buy SL Target Trailing
        run: |
          python -c "
          import os, requests, cloudscraper, time, pytz
          from datetime import datetime
          # Support both secret names
          BOT = os.getenv('TELEGRAM_BOT_TOKEN') or os.getenv('BOT_TOKEN') or os.getenv('TELEGRAM_BOT')
          CHAT = os.getenv('TELEGRAM_CHAT_ID') or os.getenv('CHAT_ID') or os.getenv('TELEGRAM_CHAT')
          print(f'BOT len={len(BOT) if BOT else 0} CHAT={CHAT}')
          IST = pytz.timezone('Asia/Kolkata')
          now = datetime.now(IST)
          def tg(m):
              try:
                  url=f'https://api.telegram.org/bot{BOT}/sendMessage'
                  r=requests.post(url, data={'chat_id':CHAT,'text':m}, timeout=15)
                  print(f'TG {r.status_code}: {r.text[:300]}')
              except Exception as e:
                  print(f'TG Err {e}')
          if not BOT or not CHAT:
              print('ERROR: Set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in Secrets')
              exit(0)
          try:
              scraper=cloudscraper.create_scraper()
              scraper.get('https://www.nseindia.com',timeout=15)
              time.sleep(1)
              oc=scraper.get('https://www.nseindia.com/api/option-chain-indices?symbol=NIFTY',timeout=15).json()
              spot=float(oc['records']['underlyingValue']); atm=round(spot/50)*50
              data=oc['records']['data']
              row=next((r for r in data if r['strikePrice']==atm),None)
              ce=row.get('CE',{}).get('lastPrice',120) if row else 120
              pe=row.get('PE',{}).get('lastPrice',110) if row else 110
          except Exception as e:
              print(f'NSE Err {e}'); spot=22900; atm=22900; ce=125; pe=115
          def lv(ltp):
              ltp=float(ltp)
              return ltp, round(ltp*0.7,1), round(ltp*1.5,1), round(ltp*2.5,1), round(ltp*3.5,1), round(ltp*0.9,1)
          b,sl,t1,t2,t3,tr = lv(ce)
          b2,sl2,t12,t22,t32,tr2 = lv(pe)
          msg=f'''✅ V32 LIVE @ {now.strftime('%H:%M')} IST - Green Fixed!
          NIFTY Spot:{spot} ATM:{atm}
          ——————————————
          🚀 CALL BUY {atm} CE @ {b}
          Buy: {b} | SL: {sl} (30%)
          T1: {t1} (50% Book) | T2: {t2} (150%) | T3: {t3} (Trail)
          Trailing SL: {tr} -> Buy={b} after T1 -> T1={t1} after T2
          ——————————————
          💥 PUT BUY {atm} PE @ {b2}
          Buy: {b2} | SL: {sl2} (30%)
          T1: {t12} (50% Book) | T2: {t22} (150%) | T3: {t32} (Trail)
          Trailing SL: {tr2} -> Buy={b2} after T1 -> T1={t12} after T2
          ——————————————
          CALL + PUT Both Ready - NSE Real Time
          '''
          tg(msg)
          "
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
