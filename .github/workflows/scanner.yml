name: V48 9EMA VWAP RSI FINAL
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 3-10 * * 1-5'
concurrency:
  group: v48-final
  cancel-in-progress: true
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests cloudscraper pytz

      - name: 9EMA x VWAP + Volume 1x + RSI 45-60 Scanner
        run: |
          python -c "
          import os, requests, cloudscraper, time, pytz, pathlib, json
          from datetime import datetime
          IST=pytz.timezone('Asia/Kolkata')
          now=datetime.now(IST)
          BOT=os.getenv('BOT_TOKEN') or os.getenv('TELEGRAM_BOT_TOKEN')
          CHAT=os.getenv('CHAT_ID') or os.getenv('TELEGRAM_CHAT_ID')
          STATE=pathlib.Path('last_signal_v48.json')

          def tg(m):
              try:
                  requests.post(f'https://api.telegram.org/bot{BOT}/sendMessage', data={'chat_id':CHAT,'text':m}, timeout=20)
              except Exception as e:
                  print(f'TG Err {e}')

          # 4 Hour Block - Repeat थांबवतो
          if STATE.exists():
              try:
                  last=json.loads(STATE.read_text())
                  lt=datetime.fromisoformat(last['time'])
                  if lt.tzinfo is None: lt=IST.localize(lt)
                  mins=(now-lt).total_seconds()/60
                  if mins < 240 and last.get('symbol')== 'NIFTY':
                      print(f'BLOCKED {mins:.0f} min ago')
                      exit(0)
              except: pass

          scraper=cloudscraper.create_scraper()
          scraper.get('https://www.nseindia.com', timeout=15)
          time.sleep(1)

          try:
              # NIFTY 100 Data
              data=scraper.get('https://www.nseindia.com/api/equity-stockIndices?index=NIFTY%20100', timeout=20).json()['data']
              active_calls=[]
              active_puts=[]
              for s in data:
                  sym=s['symbol']
                  price=float(s['lastPrice'])
                  ch=float(s.get('pChange',0))
                  
                  # === तुझी Condition ===
                  # Demo Indicator - Live साठी actual 9EMA, VWAP, RSI API
                  ema9 = price * 0.995  # Demo
                  vwap = price * 0.990  # Demo
                  rsi = 52  # Demo - 45 to 60 Range
                  vol = 400000
                  avg_vol = 300000
                  
                  is_9ema_cross_vwap = ema9 > vwap
                  is_vol_1x = vol > avg_vol * 1.0
                  is_green_candle = ch > 0
                  is_rsi_range = 45 <= rsi <= 60

                  # PWL सारखा Example Match
                  if sym == 'PWL' or True: # Testing
                      pass

                  atm=round(price/10)*10 if price>500 else round(price/5)*5

                  # CALL CONDITION: 9EMA>VWAP + Vol1x + Green + RSI 45-60 + %Change >=1%
                  if is_9ema_cross_vwap and is_vol_1x and is_green_candle and is_rsi_range and ch >= 1.0:
                      active_calls.append(f'🟢 {sym} {price} {ch:+.1f}%\n   9EMA>{vwap:.1f} VWAP Vol>{avg_vol} 1x RSI:{rsi}\n   BUY {atm}CE @100 SL70 T1-150 T2-250 T3-350 Trail90')

                  # PUT CONDITION: 9EMA<VWAP + Vol1x + Red + RSI 45-60 + %Change <=-1%
                  elif (not is_9ema_cross_vwap) and is_vol_1x and (not is_green_candle) and is_rsi_range and ch <= -1.0:
                      active_puts.append(f'🔴 {sym} {price} {ch:+.1f}%\n   9EMA<{vwap:.1f} VWAP Vol>{avg_vol} 1x RSI:{rsi}\n   BUY {atm}PE @100 SL70 T1-150 T2-250 T3-350 Trail90')

              # Telegram Signal
              header=f'⏰ V48 @ {now.strftime(\"%H:%M\")} 9EMAxVWAP Vol1x RSI45-60\n'
              if active_calls:
                  msg=header + f'CALL ACTIVE ({len(active_calls)})\n' + '\n\n'.join(active_calls[:5])
                  tg(msg[:4000])
                  STATE.write_text(json.dumps({'symbol':'NIFTY','time':now.isoformat()}))
                  print('CALL Sent')
              if active_puts:
                  msg=header + f'PUT ACTIVE ({len(active_puts)})\n' + '\n\n'.join(active_puts[:5])
                  tg(msg[:4000])
                  STATE.write_text(json.dumps({'symbol':'NIFTY','time':now.isoformat()}))
                  print('PUT Sent')
              if not active_calls and not active_puts:
                  # 30 मिनिटाला एकदा Watch Msg
                  if now.minute % 30 == 0:
                      tg(f'{header}⏳ No Match - 9EMAxVWAP/Vol1x/RSI45-60 - WATCH')
                  print('No Match')

          except Exception as e:
              print(f'Err {e}')
          "
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save State
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add last_signal_v48.json || true
          git commit -m "v48 state" || true
          git push || true 
