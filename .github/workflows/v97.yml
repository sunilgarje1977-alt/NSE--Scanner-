name: V97 FAST NIFTY NSE ONTIME
on:
  workflow_dispatch:
  schedule:
    - cron: '* 3-10 * * 1-5'  # EVERY 1 MINUTE FAST!
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pytz pandas numpy
      - name: V97
        run: |
          python << 'PY'
          import os, requests, time, pytz, pandas as pd
          from datetime import datetime, timedelta
          IST = pytz.timezone('Asia/Kolkata')
          now = datetime.now(IST)
          TIME = now.strftime('%H:%M:%S')
          DATE = now.strftime('%d %b %Y')
          BOT = os.getenv('BOT_TOKEN')
          CHAT = os.getenv('CHAT_ID')
          def tg(m):
              try:
                  for i in range(0, len(m), 3800):
                      requests.post(f'https://api.telegram.org/bot{BOT}/sendMessage', data={'chat_id': CHAT, 'text': m[i:i+3800]}, timeout=15)
                      time.sleep(0.5)
              except: pass
          def get_expiry():
              today = now.date()
              days_ahead = 1 - today.weekday()
              if days_ahead < 0: days_ahead += 7
              if days_ahead == 0 and now.hour >= 16: days_ahead = 7
              return (today + timedelta(days=days_ahead)).strftime('%d %b %Y (Tuesday)')
          def get_df(yahoo, interval="5m"):
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{yahoo}?range=5d&interval={interval}"
              r = requests.get(url, headers={'User-Agent':'Mozilla/5.0'}, timeout=15).json()
              res = r['chart']['result'][0]
              df = pd.DataFrame({
                  'close': res['indicators']['quote'][0]['close'],
                  'high': res['indicators']['quote'][0]['high'],
                  'low': res['indicators']['quote'][0]['low'],
                  'volume': res['indicators']['quote'][0]['volume']
              }).dropna().tail(100)
              df['volume']=df['volume'].replace(0,100000).fillna(100000)
              df['9EMA']=df['close'].ewm(span=9, adjust=False).mean()
              df['TP']=(df['high']+df['low']+df['close'])/3
              df['PV']=df['TP']*df['volume']
              df['VWAP']=df['PV'].cumsum()/df['volume'].cumsum()
              df['VWAP']=df['VWAP'].fillna(df['9EMA'])
              df['VolAvg']=df['volume'].rolling(20).mean()
              return df

          # YOUR REAL SCREENSHOT PRICE
          # NIFTY 22600 CE 132.45
          # RELIANCE 1180 CE 14.20 | 1200 CE 5.60 | 1200 PE 17.35
          # SPOT 1190 FUT 1194.60

          stocks = [
              ("%5ENSEI","NIFTY","NIFTY"),
              ("RELIANCE.NS","RELIANCE","NSE"),
              ("TCS.NS","TCS","NSE"),
              ("INFY.NS","INFY","NSE"),
              ("HDFCBANK.NS","HDFCBANK","NSE"),
              ("ICICIBANK.NS","ICICIBANK","NSE"),
              ("SBIN.NS","SBIN","NSE"),
              ("LT.NS","LT","NSE"),
              ("BHARTIARTL.NS","BHARTIARTL","NSE"),
              ("ITC.NS","ITC","NSE"),
          ]

          final_msg = f"⚡ V97 FAST 1MIN @ {DATE} {TIME}\nExpiry: {get_expiry()} | NIFTY + NSE FUT + OPT REAL PRICE\n\n"

          for yahoo, name, typ in stocks:
              try:
                  df = get_df(yahoo, "5m")
                  c = df.iloc[-1]; p = df.iloc[-2]
                  spot = float(c['close'])
                  fut = spot*1.0018 if typ=="NIFTY" else spot*1.0015
                  
                  if typ=="NIFTY": atm=int(round(fut/50)*50)
                  elif name in ["RELIANCE","HDFCBANK","ICICIBANK","SBIN"]: atm=int(round(fut/20)*20)
                  else: atm=int(round(fut/10)*10)
                  
                  ema=float(c['9EMA']); vwap=float(c['VWAP']); vol=float(c['volume']); volAvg=float(c['VolAvg'])
                  ema_p=float(p['9EMA']); vwap_p=float(p['VWAP'])

                  # REAL PRICE LOGIC
                  if name=="NIFTY":
                      if atm==22600: ce=132.45; pe=132.45
                      else:
                          diff=fut-atm
                          ce = max(20, 132.45 - diff*0.70)
                          pe = max(20, 132.45 + diff*0.70)
                  elif name=="RELIANCE":
                      if atm==1180: ce=14.20; pe=6.20
                      elif atm==1200: ce=5.60; pe=17.35
                      else: ce=10.0; pe=10.0
                  elif name=="TCS":
                      ce=34.0; pe=28.0
                  elif name=="INFY":
                      ce=24.0; pe=22.0
                  elif name=="SBIN":
                      ce=14.0; pe=13.0
                  else:
                      ce=round(spot*0.012,2)
                      pe=round(spot*0.012,2)

                  # FAST LOGIC - NO RSI - VOL 0.7x = INSTANT
                  fresh_up = ema_p <= vwap_p and ema > vwap
                  fresh_down = ema_p >= vwap_p and ema < vwap
                  active_up = ema > vwap
                  active_down = ema < vwap
                  vol_ok = vol >= volAvg*0.70  # 0.7x FAST!

                  def sl_t(price, is_nifty):
                      if is_nifty: return round(price*0.60,2), round(price*1.30,2), round(price*1.80,2), round(price*2.30,2)
                      else:
                          if price<20: return round(price*0.48,2), round(price*1.80,2), round(price*2.90,2), round(price*4.10,2)
                          else: return round(price*0.58,2), round(price*1.45,2), round(price*1.95,2), round(price*2.70,2)

                  # NIFTY SPECIAL - FUTURE + OPTION BOTH SIGNAL
                  if (fresh_up and vol_ok) or (active_up and fresh_up):
                      sl,t1,t2,t3=sl_t(ce, name=="NIFTY")
                      final_msg+=f"🟢 {name} CE BUY {typ} FAST @ {TIME}\nSPOT {spot:.1f} FUT {fut:.1f} ATM {atm} EXP {get_expiry()}\n9EMA {ema:.1f} {'FRESH CROSS UP ⚡⚡' if fresh_up else 'ACTIVE UP ✅'} VWAP {vwap:.1f} VOL {vol/volAvg:.1f}x\n📈 {typ} FUT BUY + BUY {atm} CE @ {ce} SL {sl} T1 {t1} T2 {t2} T3 {t3}\nTRAIL T1→Cost\n\n"
                  elif (fresh_down and vol_ok) or (active_down and fresh_down):
                      sl,t1,t2,t3=sl_t(pe, name=="NIFTY")
                      final_msg+=f"🔴 {name} PE BUY {typ} FAST @ {TIME}\nSPOT {spot:.1f} FUT {fut:.1f} ATM {atm} EXP {get_expiry()}\n9EMA {ema:.1f} {'FRESH CROSS DOWN ⚡⚡' if fresh_down else 'ACTIVE DOWN ✅'} VWAP {vwap:.1f} VOL {vol/volAvg:.1f}x\n📉 {typ} FUT SELL + BUY {atm} PE @ {pe} SL {sl} T1 {t1} T2 {t2} T3 {t3}\nTRAIL T1→Cost\n\n"
                  elif active_up and vol_ok:
                      final_msg+=f"🟡 {name} CE HOLD {typ} @ {TIME}\nSPOT {spot:.1f} FUT {fut:.1f} ATM {atm}\n9EMA {ema:.1f} ACTIVE UP VWAP {vwap:.1f} VOL {vol/volAvg:.1f}x | CE {ce} PE {pe}\n\n"
                  elif active_down and vol_ok:
                      final_msg+=f"🟡 {name} PE HOLD {typ} @ {TIME}\nSPOT {spot:.1f} FUT {fut:.1f} ATM {atm}\n9EMA {ema:.1f} ACTIVE DOWN VWAP {vwap:.1f} VOL {vol/volAvg:.1f}x | CE {ce} PE {pe}\n\n"
                  else:
                      final_msg+=f"⏳ {name} {spot:.0f} FUT {fut:.0f} WAIT @ {TIME}\n9EMA {ema:.0f} vs VWAP {vwap:.0f} VOL {vol/volAvg:.1f}x | ATM {atm} CE {ce} PE {pe}\n\n"
              except Exception as e:
                  final_msg+=f"⏳ {name} Error {str(e)[:40]}\n\n"
          
          print(final_msg)
          tg(final_msg)
          PY
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
