name: V80 FIX VWAP VOL
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 3-10 * * 1-5'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests cloudscraper pytz pandas numpy
      - name: V80 FIX
        run: |
          python << 'PY'
          import os, requests, time, pytz
          import pandas as pd
          from datetime import datetime
          IST = pytz.timezone('Asia/Kolkata')
          now = datetime.now(IST)
          TIME = now.strftime('%H:%M:%S')
          DATE = now.strftime('%d %b %Y')
          BOT = os.getenv('BOT_TOKEN')
          CHAT = os.getenv('CHAT_ID')
          def tg(m):
              try:
                  for i in range(0, len(m), 3800):
                      requests.post(f'https://api.telegram.org/bot{BOT}/sendMessage', data={'chat_id': CHAT, 'text': m[i:i+3800]}, timeout=15)
                      time.sleep(1)
              except: pass

          def get_signal_fixed(symbol_yahoo, name):
              try:
                  url=f"https://query1.finance.yahoo.com/v8/finance/chart/{symbol_yahoo}?range=5d&interval=15m"
                  r=requests.get(url, headers={'User-Agent':'Mozilla/5.0'}, timeout=12).json()
                  res=r['chart']['result'][0]
                  closes=res['indicators']['quote'][0]['close']
                  volumes=res['indicators']['quote'][0]['volume']
                  highs=res['indicators']['quote'][0]['high']
                  lows=res['indicators']['quote'][0]['low']
                  df=pd.DataFrame({'close':closes,'high':highs,'low':lows,'volume':volumes}).dropna()
                  if len(df)<25: return None
                  
                  # Fix: Volume 0 असेल तर 1 ने replace - VWAP nan होणार नाही
                  df['volume'] = df['volume'].replace(0, 100000)
                  df['volume'] = df['volume'].fillna(100000)
                  
                  df['9EMA']=df['close'].ewm(span=9, adjust=False).mean()
                  df['21EMA']=df['close'].ewm(span=21, adjust=False).mean()
                  df['TP']=(df['high']+df['low']+df['close'])/3
                  df['PV']=df['TP']*df['volume']
                  df['VWAP']=df['PV'].cumsum()/df['volume'].cumsum()
                  # VWAP nan असेल तर 21EMA वापरा - Big Players Price
                  df['VWAP'] = df['VWAP'].fillna(df['21EMA'])
                  
                  delta=df['close'].diff()
                  gain=(delta.where(delta>0,0)).rolling(14).mean()
                  loss=(-delta.where(delta<0,0)).rolling(14).mean()
                  rs=gain/loss
                  df['RSI']=100-(100/(1+rs))
                  df['VolAvg']=df['volume'].rolling(20).mean()
                  
                  c=df.iloc[-1]; p=df.iloc[-2]
                  spot=float(c['close'])
                  ema=float(c['9EMA']); vwap=float(c['VWAP']); rsi=float(c['RSI'])
                  vol=float(c['volume']); volAvg=float(c['VolAvg'])
                  
                  # NIFTY साठी Volume Condition Skip - कारण Yahoo Volume 0 देतो
                  is_index = symbol_yahoo == "%5ENSEI"
                  vol_ok = True if is_index else (vol > volAvg*0.9)
                  
                  cross_up = float(p['9EMA'])<=float(p['VWAP']) and ema>vwap
                  cross_down = float(p['9EMA'])>=float(p['VWAP']) and ema<vwap
                  
                  # RSI Range थोडा मोठा केला - 40-65 - म्हणजे Buy जास्त येईल
                  atm = round(spot/50)*50 if spot>10000 else round(spot/10)*10
                  
                  # NIFTY Option Price
                  ce=pe=0
                  try:
                      import cloudscraper
                      scraper=cloudscraper.create_scraper()
                      scraper.get('https://www.nseindia.com', timeout=8)
                      rr=scraper.get('https://www.nseindia.com/api/option-chain-indices?symbol=NIFTY', headers={'Referer':'https://www.nseindia.com/option-chain'}, timeout=10).json()
                      for rec in rr['records']['data']:
                          if rec.get('strikePrice')==atm:
                              if 'CE' in rec: ce=float(rec['CE']['lastPrice'])
                              if 'PE' in rec: pe=float(rec['PE']['lastPrice'])
                  except: ce=105; pe=185
                  
                  if cross_up and 40<=rsi<=68:
                      return f"🟢 {name} CE BUY @ {TIME}\nSPOT {spot:.0f} ATM {atm}\n9EMA {ema:.0f} CROSS UP VWAP {vwap:.0f} ✅\nRSI {rsi:.0f} (40-68) ✅ VOL {'NSE' if is_index else '1x'} ✅\n📈 BUY {atm} CE @ {ce} | SL {round(ce*0.7)} T1 {round(ce*1.4)} T2 {round(ce*1.8)}\nTRAIL: T1->Cost, T2->T1 Lock\n"
                  elif cross_down and 35<=rsi<=65:
                      return f"🔴 {name} PE BUY @ {TIME}\nSPOT {spot:.0f} ATM {atm}\n9EMA {ema:.0f} CROSS DOWN VWAP {vwap:.0f} ✅\nRSI {rsi:.0f} (35-65) ✅ VOL {'NSE' if is_index else '1x'} ✅\n📉 BUY {atm} PE @ {pe} | SL {round(pe*0.7)} T1 {round(pe*1.4)} T2 {round(pe*1.8)}\nTRAIL: T1->Cost, T2->T1 Lock\n"
                  elif ema>vwap:
                      return f"📈 {name} {spot:.0f} BULLISH (9EMA {ema:.0f}>VWAP {vwap:.0f} RSI {rsi:.0f}) - CE Watch Cross होताच BUY\n"
                  else:
                      return f"📉 {name} {spot:.0f} BEARISH (9EMA {ema:.0f}<VWAP {vwap:.0f} RSI {rsi:.0f}) - PE Watch Cross होताच BUY\n"
              except Exception as e:
                  return f"⏳ {name} Error {str(e)[:50]}\n"

          # NIFTY + ALL SHARES
          all_syms = [("%5ENSEI","NIFTY"), ("RELIANCE.NS","RELIANCE"), ("TCS.NS","TCS"), ("INFY.NS","INFY"), ("HDFCBANK.NS","HDFCBANK"), ("ICICIBANK.NS","ICICIBANK"), ("SBIN.NS","SBIN"), ("BHARTIARTL.NS","BHARTIARTL"), ("LT.NS","LT"), ("ITC.NS","ITC")]

          final_msg = f"V80 FIX @ {DATE} {TIME}\n\n"
          for sym, name in all_syms:
              sig = get_signal_fixed(sym, name)
              if sig: final_msg += sig + "\n"
              time.sleep(0.6)

          final_msg += "\n--- RELIANCE SPECIAL ---\nENTRY Above 1208 SL 1188 T1 1220 T2 1245 T3 1270 TRAIL 1220->1195\nOn V80 FIX - VWAP nan Fix"
          print(final_msg)
          tg(final_msg)
          PY
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
