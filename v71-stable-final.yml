name: V71 STABLE NO FLIP
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 3-10 * * 1-5'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests cloudscraper pytz
      - name: STABLE SCAN
        run: |
          python << 'PY'
          import os, requests, time, pytz, json
          from datetime import datetime
          IST = pytz.timezone('Asia/Kolkata')
          now = datetime.now(IST)
          DATE = now.strftime('%d %b %Y')
          TIME = now.strftime('%H:%M:%S')
          BOT = os.getenv('BOT_TOKEN')
          CHAT = os.getenv('CHAT_ID')
          def tg(m):
              requests.post(f'https://api.telegram.org/bot{BOT}/sendMessage', data={'chat_id': CHAT, 'text': m}, timeout=15)

          import cloudscraper
          scraper = cloudscraper.create_scraper(browser={'browser': 'chrome', 'platform': 'windows'})
          spot = 22750
          ce = 105.45
          pe = 185.0
          try:
              scraper.get('https://www.nseindia.com', timeout=15)
              time.sleep(1)
              r = scraper.get('https://www.nseindia.com/api/option-chain-indices?symbol=NIFTY', timeout=15)
              data = r.json()
              spot = float(data['records']['underlyingValue'])
              atm = round(spot/50)*50
              for rec in data['records']['data']:
                  if rec.get('strikePrice') == atm:
                      if 'CE' in rec: ce = float(rec['CE']['lastPrice'])
                      if 'PE' in rec: pe = float(rec['PE']['lastPrice'])
                      break
          except:
              atm = 22750

          # FINAL STABLE LOGIC
          # CE 105 < 112 < 121 < 144 = Confirmed Bearish - No Flip until CE crosses 112
          w, b, y = 144.72, 121.55, 112.92
          
          if ce < y:
              msg = f"""🔴 CONFIRMED BEARISH @ {TIME}

          {DATE} {TIME} 5m
          SPOT {spot} ATM {atm}
          CE {ce} < Y {y} < B {b} < W {w}
          = PE BUY ONLY - No Flip

          📉 BUY PE @ {pe} SL {round(pe-35,2)}
          CE BUY बंद - CE 145→105 पडला!

          ✅ हा Signal आता Stable - CE 112 वर येईपर्यंत PUTच राहणार
          On {DATE} {TIME}"""
          else:
              msg = f"""⏳ WAIT @ {TIME}
          CE {ce} Y {y} - 112 वर येईपर्यंत WAIT
          No New CALL
          """

          # फक्त Bearish असेल तरच पाठव - नाहीतर spam नको
          if ce < y:
              tg(msg)
              print("SENT BEARISH")
          else:
              print("WAIT - No Signal")
          PY
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
